<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Shadow Geospatial V2 – Quellenprototyp</title>
<link rel="stylesheet" href="vendor/maplibre-gl/maplibre-gl.css">
<style>
html,body{height:100%;margin:0;background:#101820;color:#d9e3ed;font:14px system-ui,sans-serif}
body{display:flex;flex-direction:column} header{padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #384451}
header strong{margin-right:12px} button,input{font:inherit;background:#182530;color:inherit;border:1px solid #485766;padding:7px;border-radius:4px} button{cursor:pointer} button:disabled{opacity:.5;cursor:default}
#m{position:relative;flex:1;min-height:0} footer{padding:8px 14px;min-height:20px} #meldung{color:#d8b77c}
</style></head>
<body><header><strong>SHADOW / K2a – Quellenprototyp</strong>
<input id="key" type="password" placeholder="Lokaler CARTO-Schlüssel" aria-label="CARTO-Schlüssel" autocomplete="off" spellcheck="false">
<button id="voyager" disabled>Voyager</button><button id="dunkel" disabled>Dark Matter (Referenz)</button><button id="leer" disabled>Leeren</button>
<button id="flach" disabled>2D</button><button id="geneigt" disabled>Geneigt</button></header>
<div id="m" aria-label="Kartenprototyp"></div>
<footer><span id="meldung" role="status">Lokale Bibliothek wird geprüft.</span> · Keine Profil- oder Terminaldaten · © OpenStreetMap contributors, © CARTO</footer>
<script src="vendor/maplibre-gl/maplibre-gl.js"></script>
<script src="karte-v2-quellen.js"></script>
<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const melden = s => { $('meldung').textContent = s; };
  if (typeof maplibregl === 'undefined' || typeof KARTE_V2_QUELLEN === 'undefined') {
    melden('Lokale MapLibre-Dateien fehlen. Entwicklungsanleitung: docs/geospatial-v2-entwicklungsplan.md, K2a.');
    return;
  }
  const Q = KARTE_V2_QUELLEN;
  let key = '', map, modus = 'leer';
  try {
    map = new maplibregl.Map({ container: 'm', style: Q.leererStil(), center: [13.405,52.52], zoom: 13,
      transformRequest: url => Q.cartoRequest(url, key), attributionControl: true });
    map.addControl(new maplibregl.NavigationControl({visualizePitch:true}), 'top-right');
  } catch (e) { melden('MapLibre konnte nicht gestartet werden. Grafikbeschleunigung prüfen.'); return; }
  /* Fehlermeldungen nicht aus Anbieter-URLs übernehmen (diese können den Key enthalten). */
  map.on('error', () => melden('Kartenressource nicht verfügbar. Verbindung, Schlüssel und Anbieter prüfen.'));
  map.on('style.load', () => melden(modus === 'leer' ? 'Lokale Karte bereit. Keine Kachelquelle aktiv.' : 'Stil geladen; Kacheln werden bei Bedarf angefordert.'));
  function wechseln(name) {
    const url = Q.stil(name), eingabe = $('key').value.trim();
    if (!url || (!eingabe && !key)) { melden('CARTO-Schlüssel lokal eingeben. Kein Abruf erfolgt.'); return; }
    if (eingabe) key = eingabe;
    $('key').value = ''; modus = name;
    melden('CARTO-Stil wird geladen.');
    try { map.setStyle(url, { diff: false }); }
    catch (e) { melden('Kartenstil konnte nicht gewechselt werden.'); }
  }
  $('voyager').onclick = () => wechseln('voyager');
  $('dunkel').onclick = () => wechseln('dunkel');
  $('leer').onclick = () => { modus = 'leer'; key = ''; $('key').value = ''; map.setStyle(Q.leererStil(), {diff:false}); };
  $('flach').onclick = () => map.easeTo({pitch:0,bearing:0});
  $('geneigt').onclick = () => map.easeTo({pitch:60});
  ['voyager','dunkel','leer','flach','geneigt'].forEach(id => { $(id).disabled = false; });
  melden('MapLibre lokal bereit. CARTO-Abruf erst nach Stilwahl.');
})();
</script></body></html>
