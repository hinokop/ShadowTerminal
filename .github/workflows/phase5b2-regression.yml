name: Phase 5b2 - Map and dossier research regressions (draft only)

on:
  push:
    branches:
      - refactor/phase5b2-recherchekarte-dossier-20261122

permissions:
  contents: read

jobs:
  verify:
    name: Legacy knowledge, map and dossier access
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser dependencies
        working-directory: tests
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0 maplibre-gl@4.7.1
          npx playwright install --with-deps chromium
      - name: Create non-secret CARTO fixture
        run: |
          printf 'window.KARTEN_SCHLUESSEL = {carto: "cb1_ci_fixture_not_a_real_token"};\n' > kartenschluessel.js
      - name: Python local archive bridge tests
        run: python3 tests/terminal_bridge_pagination.py
      - name: Phase 5b2 new map and dossier access regression (isolated)
        env:
          FT_PARALLEL: '1'
        run: node tests/runall.js phase5b2-recherchezugang
      - name: Relevant map, dossier, historical knowledge and terminal regressions
        env:
          FT_PARALLEL: '3'
        run: |
          node tests/runall.js phase5b2-recherchezugang al zb ds2 missionstrennung dossier-einheitlich dossier-kurzlage dossier-maske dossier-fallverweise karte-sperre-pins terminal-sudo terminal-namensnavigation sichtung-export
      - name: Full standard selection
        env:
          FT_PARALLEL: '4'
        run: node tests/runall.js
      - name: Upload test diagnostics when failing
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase5b2-test-logs
          path: /tmp/ft-out/*.txt
          if-no-files-found: ignore
          retention-days: 3
