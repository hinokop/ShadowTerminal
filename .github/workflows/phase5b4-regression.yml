name: Phase 5b4 - Inbox-only Ablage and research workspace regressions

on:
  push:
    branches:
      - refactor/phase5b4-workspace-legacy-access-20261122

permissions:
  contents: read

jobs:
  verify:
    name: Visible Ablage, research workspaces and legacy compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser dependencies
        working-directory: tests
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0 maplibre-gl@4.7.1
          npx playwright install --with-deps chromium
      - name: Create non-secret CARTO fixture
        run: |
          printf 'window.KARTEN_SCHLUESSEL = {carto: "cb1_ci_fixture_not_a_real_token"};\n' > kartenschluessel.js
      - name: Python local archive bridge tests
        run: python3 tests/terminal_bridge_pagination.py
      - name: Phase 5b4 new workspace and registratur-removal test
        env:
          FT_PARALLEL: '1'
        run: node tests/runall.js phase5b4-arbeitszugang
      - name: Related inbox, legacy archive and research regressions
        env:
          FT_PARALLEL: '3'
        run: |
          node tests/runall.js phase5b4-arbeitszugang ablage-eingang ak2 arbeitsstand arbeitsstand-tasten fall-modul recherche unterlagen dossier-sperre dossier-einheitlich phase5b3-dossieroberflaeche
      - name: Complete standard selection
        env:
          FT_PARALLEL: '4'
        run: node tests/runall.js
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase5b4-test-logs
          path: /tmp/ft-out/*.txt
          if-no-files-found: ignore
          retention-days: 3
