name: Phase 5b7 - Legacy mission mode retired

on:
  push:
    branches:
      - refactor/phase5b7-missionsbetrieb-stilllegen-20261123

permissions:
  contents: read

jobs:
  verify:
    name: Retired mission mode, adapted guards and complete standard selection
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser dependencies
        working-directory: tests
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0 maplibre-gl@4.7.1
          npx playwright install --with-deps chromium
      - name: Create non-secret CARTO fixture
        run: |
          printf 'window.KARTEN_SCHLUESSEL = {carto: "cb1_ci_fixture_not_a_real_token"};\n' > kartenschluessel.js
      - name: Python local archive bridge tests
        run: python3 tests/terminal_bridge_pagination.py
      - name: Phase 5b7 new isolated browser regression
        env:
          FT_PARALLEL: '1'
        run: node tests/runall.js phase5b7-missionsbetrieb
      - name: Related dossier and legacy mission regressions
        env:
          FT_PARALLEL: '2'
        run: |
          node tests/runall.js phase5b7-missionsbetrieb phase5b6-dossier-kennungen phase5b5-dossier-nachtraege phase5b4-arbeitszugang phase5b3-dossieroberflaeche phase5b2-recherchezugang missionstrennung kartenprotokoll lage-box recherche-oberflaeche sichtung-export terminal-sudo terminal-namensnavigation alterung pin-nummern-tasten dossier-sperre
      - name: Complete standard selection
        env:
          FT_PARALLEL: '4'
        run: node tests/runall.js
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase5b7-test-logs
          path: /tmp/ft-out/*.txt
          if-no-files-found: ignore
          retention-days: 3
