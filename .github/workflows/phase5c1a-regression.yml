name: Phase 5c1a - Profile texts stored in the profile

on:
  push:
    branches:
      - refactor/phase5c1a-profiltexte-20261122

permissions:
  contents: read

jobs:
  verify:
    name: Profile texts, import semantics and complete standard selection
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser dependencies
        working-directory: tests
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0 maplibre-gl@4.7.1
          npx playwright install --with-deps chromium
      - name: Create non-secret CARTO fixture
        run: |
          printf 'window.KARTEN_SCHLUESSEL = {carto: "cb1_ci_fixture_not_a_real_token"};\n' > kartenschluessel.js
      - name: Python local archive bridge tests
        run: python3 tests/terminal_bridge_pagination.py
      - name: Syntax of all application scripts
        run: |
          for f in szenario.js karte-modul.js akten-modul.js recherche-modul.js profil-modul.js fall-modul.js arbeitsstand-modul.js; do node --check "$f"; done
      - name: Profile, import and reset regressions
        env:
          FT_PARALLEL: '2'
        run: |
          node tests/runall.js phase5c1a-profiltexte pn fallpaket recherche identitaeten verlaesslichkeit arbeitsnavigation profil-assessment missionstrennung dossier-nummern dossier-maske sichtung-pin sichtung-import fall-modul dossier-galerie-nummern profil-seq-galerie terminal-profanity-kontakt phase5b7-missionsbetrieb dossier-sperre
      - name: Complete standard selection
        env:
          FT_PARALLEL: '4'
        run: node tests/runall.js
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase5c1a-test-logs
          path: /tmp/ft-out/*.txt
          if-no-files-found: ignore
          retention-days: 3
