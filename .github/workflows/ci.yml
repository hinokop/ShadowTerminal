name: CI

# Dauerhafte Prüfung: jeder Pull Request gegen main und jeder Push auf main.
# Ersetzt die früheren phasengebundenen Workflows (phase5*-regression.yml; in der
# Git-Historie vor dem Entfernen weiterhin einsehbar).

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Syntax, Python bridge and standard test selection
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser dependencies
        working-directory: tests
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0 maplibre-gl@4.7.1
          npx playwright install --with-deps chromium
      - name: Create non-secret CARTO fixture
        run: |
          printf 'window.KARTEN_SCHLUESSEL = {carto: "cb1_ci_fixture_not_a_real_token"};\n' > kartenschluessel.js
      - name: Python local archive bridge tests
        run: python3 tests/terminal_bridge_pagination.py
      - name: Syntax of all application scripts
        run: |
          for f in szenario.js karte-modul.js akten-modul.js recherche-modul.js terminal-locale.js terminal-vfs.js terminal-dateibefehle.js terminal-intel.js profil-modul.js fall-modul.js arbeitsstand-modul.js; do node --check "$f"; done
      - name: Standard test selection
        env:
          FT_PARALLEL: '4'
        run: node tests/runall.js
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-logs
          path: /tmp/ft-out/*.txt
          if-no-files-found: ignore
          retention-days: 3
