name: Phase 5a - Regressions (draft only)

# Run only on the current migration draft; no recurring runs on main.
on:
  push:
    branches:
      - refactor/phase5a-dossierfreigaben-abbau-20261121

permissions:
  contents: read

jobs:
  verify:
    name: Legacy and research regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        working-directory: tests
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0 maplibre-gl@4.7.1
          npx playwright install --with-deps chromium
      - name: Set up optional local map-key placeholder
        run: |
          printf 'window.KARTEN_SCHLUESSEL = {carto: "cb1_ci_fixture_not_a_real_token"};\n' > kartenschluessel.js
      - name: Assert CARTO fixture used by legacy map regression
        env:
          FT_PARALLEL: '1'
        run: node tests/runall.js zn
      - name: Reproduce zone-event popup in six isolated runs
        env:
          FT_PARALLEL: '1'
        run: |
          mkdir -p /tmp/ft-zone-probe
          failed=0
          for i in 1 2 3 4 5 6; do
            echo "::group::zev isolated repetition $i"
            if node tests/runall.js zev; then
              echo "ZEV repetition $i: PASS"
            else
              echo "ZEV repetition $i: FAIL"
              failed=$((failed + 1))
            fi
            cp /tmp/ft-out/zev.txt "/tmp/ft-zone-probe/zev-$i.txt"
            echo "::endgroup::"
          done
          echo "ZEV isolated repeats failed: $failed / 6"
          test "$failed" -eq 0
      - name: Preserve isolated zone-event evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zone-event-repetitions
          path: /tmp/ft-zone-probe/*.txt
          if-no-files-found: ignore
          retention-days: 3
      - name: Exercise zone-event popup with parallel browser load
        env:
          FT_PARALLEL: '4'
        run: node tests/runall.js zev zn terminal-sudo missionstrennung
      - name: Verify Python archive bridge
        run: python3 tests/terminal_bridge_pagination.py
      - name: Critical previously failing tests
        env:
          FT_PARALLEL: '3'
        run: |
          node tests/runall.js al zb ds2 missionstrennung terminal-sudo terminal-namensnavigation
      - name: Other targeted product regressions
        env:
          FT_PARALLEL: '3'
        run: |
          node tests/runall.js terminal-navigation terminal-pin-suche terminal-objektnavigation terminal-archiv-zugriff karte-sperre-pins dossier-einheitlich fallpaket sichtung-import
      - name: Full standard selection
        env:
          FT_PARALLEL: '4'
        run: node tests/runall.js
      - name: Upload test text diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: /tmp/ft-out/*.txt
          if-no-files-found: ignore
          retention-days: 3
